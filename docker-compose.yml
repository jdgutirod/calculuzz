# Runs the whole app: the Go API and the React frontend.
#
#   docker compose up --build
#
# Host ports can be changed with FRONTEND_PORT and BACKEND_PORT (see .env.example).
# Both containers listen on 8080 inside; only the host side changes.

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # The browser loads the frontend from this origin, so CORS must allow it.
      ALLOWED_ORIGIN: "http://localhost:${FRONTEND_PORT:-5173}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JavaScript at build time. The browser calls the API
        # directly, so this is the backend's address as seen from the host.
        VITE_API_URL: "http://localhost:${BACKEND_PORT:-8080}"
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend
    restart: unless-stopped
